name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.cc }} / LLVM ${{ matrix.llvm }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: clang-23
            cxx: clang++-23
            llvm: 23
          - cc: gcc
            cxx: g++
            llvm: 21
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      PYTHONIOENCODING: utf8
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ matrix.llvm }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 rsync zlib1g-dev libzstd-dev llvm-${{ matrix.llvm }}-dev
          if [[ "$CC" == clang-* ]]; then sudo apt-get install -y --no-install-recommends ${{ matrix.cc }}; fi

      - name: Configure
        run: cmake -S . -B build -GNinja -DLLVM_DIR=/usr/lib/llvm-${{ matrix.llvm }}/lib/cmake/llvm

      - name: Build
        run: ninja -C build

      - name: Test
        run: ninja -C build tests

      - name: Check grammar
        run: ninja -C build grammar

      - name: Package
        if: startsWith(github.ref, 'refs/tags/') && matrix.llvm == 23
        working-directory: build
        run: echo "EMOJICODE_DIST_ARCHIVE=$(python3 ../dist.py archive)" >> "$GITHUB_ENV"

      - name: Upload distribution archive
        if: startsWith(github.ref, 'refs/tags/') && matrix.llvm == 23
        uses: actions/upload-artifact@v4
        with:
          name: emojicode-dist
          path: ${{ env.EMOJICODE_DIST_ARCHIVE }}
